name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build-time placeholders only. `next build` initializes the Firebase client SDK
  # while prerendering pages, which requires these to be non-empty — but it never
  # contacts Firebase during a build, so dummy values are safe here. Real values
  # live in Vercel, which builds production deploys with its own environment.
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
